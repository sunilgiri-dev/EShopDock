services:
  # MongoDB for all services
  mongo:
    image: mongo:5
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Eureka Discovery Server
  discovery-server:
    build: ./discovery-server
    container_name: discovery-server
    ports:
      - "8761:8761"
    environment:
      - JAVA_OPTS=
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -ln | grep :8761 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # API Gateway
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=verySecureRandomKeyForDevelopmentOnlyThisKeyMustBeAtLeast64BytesLongForHS512AlgorithmToWorkProperlyAndSecurelyInProduction
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -ln | grep :8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Auth Service
  auth-service:
    build: ./auth-service
    container_name: auth-service
    environment:
      - JWT_SECRET=verySecureRandomKeyForDevelopmentOnlyThisKeyMustBeAtLeast64BytesLongForHS512AlgorithmToWorkProperlyAndSecurelyInProduction
    depends_on:
      mongo:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "sh", "-c", "ps aux | grep java || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Product Service
  product-service:
    build: ./product-service
    container_name: product-service
    depends_on:
      mongo:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "sh", "-c", "ps aux | grep java || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Order Service
  order-service:
    build: ./order-service
    container_name: order-service
    depends_on:
      mongo:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "sh", "-c", "ps aux | grep java || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Inventory Service
  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    depends_on:
      mongo:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "sh", "-c", "ps aux | grep java || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Zookeeper (modern version)
  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes

  # Kafka Broker (compatible version)
  kafka:
    image: bitnami/kafka:3.4
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_ENABLE_KRAFT=no
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_BROKER_ID=1
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Kafka Topic Initializer
  kafka-init:
    image: bitnami/kafka:3.4
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./init-kafka-topics.sh:/tmp/init-kafka-topics.sh:ro
    command: |
      bash -c "
        echo 'Waiting for Kafka to be ready...'
        sleep 30
        echo 'Creating Kafka topics...'
        
        # Order topics
        kafka-topics.sh --create --topic order-created --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --if-not-exists
        kafka-topics.sh --create --topic order-updated --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --if-not-exists
        kafka-topics.sh --create --topic order-cancelled --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --if-not-exists
        kafka-topics.sh --create --topic order-completed --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --if-not-exists
        
        # Product topics
        kafka-topics.sh --create --topic product-created --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --if-not-exists
        kafka-topics.sh --create --topic product-updated --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --if-not-exists
        kafka-topics.sh --create --topic product-deleted --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --if-not-exists
        
        # Inventory topics
        kafka-topics.sh --create --topic inventory-updated --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --if-not-exists
        kafka-topics.sh --create --topic inventory-low-stock --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --if-not-exists
        kafka-topics.sh --create --topic inventory-out-of-stock --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --if-not-exists
        kafka-topics.sh --create --topic inventory-restocked --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1 --if-not-exists
        
        echo 'Kafka topics created successfully!'
        kafka-topics.sh --list --bootstrap-server kafka:9092
      "
    restart: "no"


volumes:
  mongo-data:
